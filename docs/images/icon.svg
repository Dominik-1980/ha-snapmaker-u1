<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3a4b"/><stop offset="1" stop-color="#18212c"/>
    </linearGradient>
    <linearGradient id="cavity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4656"/><stop offset="1" stop-color="#1b222c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- enclosure -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#frame)"/>
  <g transform="translate(256 256) scale(1.1) translate(-256 -256)">
  <!-- window / build chamber -->
  <rect x="70" y="70" width="372" height="372" rx="44" fill="url(#cavity)"/>
  <rect x="70" y="70" width="372" height="120" rx="44" fill="url(#glow)"/>
  <!-- gantry rail -->
  <rect x="94" y="122" width="324" height="20" rx="10" fill="#c9d3df"/>
  <!-- four parked toolheads (toolchanger) -->
  <g>
    <rect x="98"  y="92" width="52" height="40" rx="12" fill="#ff7a1a"/>
    <rect x="170" y="92" width="52" height="40" rx="12" fill="#2f9bff"/>
    <rect x="292" y="94" width="48" height="36" rx="11" fill="none" stroke="#6b7c91" stroke-width="4" stroke-dasharray="9 7"/>
    <rect x="362" y="92" width="52" height="40" rx="12" fill="#e64fb4"/>
  </g>
  <!-- active print head -->
  <rect x="216" y="150" width="80" height="62" rx="16" fill="#2fc46b"/>
  <rect x="232" y="166" width="48" height="10" rx="5" fill="#ffffff" opacity=".55"/>
  <path d="M238 212 L274 212 L262 240 L250 240 Z" fill="#f2b33d"/>
  <circle cx="256" cy="244" r="7" fill="#ffd27a"/>
  <!-- printed object: 4-colour layers -->
  <g>
    <rect x="196" y="330" width="120" height="26" rx="6" fill="#ff7a1a"/>
    <rect x="204" y="304" width="104" height="26" rx="6" fill="#2f9bff"/>
    <rect x="212" y="278" width="88"  height="26" rx="6" fill="#e64fb4"/>
    <rect x="220" y="256" width="72"  height="22" rx="6" fill="#2fc46b"/>
  </g>
  <!-- build plate -->
  <rect x="112" y="356" width="288" height="26" rx="13" fill="#c9d3df"/>
  <rect x="112" y="356" width="288" height="8" rx="4" fill="#ffffff" opacity=".35"/>
  </g>
</svg>
